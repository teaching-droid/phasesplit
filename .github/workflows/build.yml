name: build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux gcc
            os: ubuntu-latest
            cmake_args: -DCMAKE_C_COMPILER=gcc
          - name: linux clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_C_COMPILER=clang
          - name: macos clang
            os: macos-latest
            cmake_args: -DCMAKE_C_COMPILER=clang
          - name: windows msvc
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: build
        run: cmake --build build --config Release

      # Run verbosely so the checks are readable in the log rather than only on
      # failure. The one to watch is "SSE2 agrees with scalar": it has to read
      # 0.00e+00, because that path being identical to the plain C is the whole
      # reason it is the default. A compiler that fuses multiply and add in the
      # scalar code breaks it, and this is what notices.
      - name: test
        run: ctest --test-dir build -C Release --verbose
