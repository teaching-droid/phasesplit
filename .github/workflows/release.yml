name: release

# Tagging a version builds it on all three platforms, checks each one, and
# publishes the binaries with notes assembled from the commits since the last
# tag. Nothing is uploaded unless every platform passed its own self test.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build and publish, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true          # a broken platform must not produce a part-release
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset: phasesplit-linux-x86_64
          - name: macos
            os: macos-latest
            asset: phasesplit-macos-arm64
          - name: windows
            os: windows-latest
            asset: phasesplit-windows-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build --config Release

      - name: test
        run: ctest --test-dir build -C Release --verbose

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp build/phasesplit dist/${{ matrix.asset }}/
          cp LICENSE dist/${{ matrix.asset }}/
          cp packaging/README.txt dist/${{ matrix.asset }}/
          tar -C dist -czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.asset }} | Out-Null
          Copy-Item build/Release/phasesplit.exe dist/${{ matrix.asset }}/
          Copy-Item LICENSE dist/${{ matrix.asset }}/
          Copy-Item packaging/README.txt dist/${{ matrix.asset }}/
          Compress-Archive -Path dist/${{ matrix.asset }} -DestinationPath ${{ matrix.asset }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # the notes are built from the history

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # A short standing description first, then whatever changed since the
      # last tag underneath it. gh puts the generated section below the notes
      # given here rather than replacing them.
      - name: write the opening section
        run: |
          cat > notes.md <<'EOF'
          Stereo centre/side separation and channel processing.

          The centre and the sides always add back up to the input, so nothing
          is invented and nothing is lost, and content panned hard to one side
          gives a centre of exactly zero.

          Each archive holds a single binary with no dependencies beyond the
          system libraries. Unpack it anywhere and run it. To check the build
          on your own machine:

              phasesplit --selftest

          Built and tested on Linux, macOS and Windows by the workflow that
          produced this release.
          EOF

      # The generated section is fetched rather than left to --generate-notes so
      # the trailing "Full Changelog" link can be dropped. It only repeats the
      # tag that is already on the page.
      - name: add what changed since the last tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md || true
          grep -v '^\*\*Full Changelog\*\*:' generated.md > generated.clean || true
          if [ -s generated.clean ]; then
            printf '\n' >> notes.md
            cat generated.clean >> notes.md
          fi
          cat notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la artifacts
          gh release create "$TAG" \
            --title "phasesplit $TAG" \
            --notes-file notes.md \
            artifacts/*
